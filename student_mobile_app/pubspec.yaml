name: student_mobile_app
description: "SkillVerse AI - Student Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation & Routing
  go_router: ^13.1.0
  
  # Styling & Icons
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  cupertino_icons: ^1.0.6
  
  # Database & Auth Client
  supabase_flutter: ^2.3.3
  
  # Network & WebSockets
  http: ^1.2.0
  web_socket_channel: ^2.4.1
  
  # Real-time WebRTC
  flutter_webrtc: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

